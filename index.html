<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nine &amp; Done — Pocket Golf</title>
<meta name="description" content="Pick a club, swing your phone like a golf club, play the hole." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b1f;
    --paper:#f2ecd8;
    --fairway-dark:#204a32;
    --sand-dark:#cdb069;
    --gold:#c9a24b;
    --danger:#c0392b;
    --rough:#173a22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--rough);
    font-family:'JetBrains Mono', monospace;
    color:var(--paper);
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    height:100dvh; width:100vw;
  }

  /* ---------- HUD ---------- */
  #hud{
    background:var(--paper);
    color:var(--ink);
    padding:10px 14px 8px;
    position:relative;
    border-bottom:3px dashed var(--sand-dark);
    flex-shrink:0;
    z-index:5;
  }
  .hud-top{
    display:flex; justify-content:space-between; align-items:center;
  }
  .hole-label{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:20px;
  }
  .hole-label small{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:12px;
    color:var(--fairway-dark);
    margin-left:6px;
  }
  #modeToggle{
    background:var(--fairway-dark);
    color:var(--paper);
    border:none;
    border-radius:16px;
    padding:6px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
  }
  #modeToggle:disabled{ opacity:0.4; }
  .hud-stats{
    display:flex; gap:14px; margin-top:6px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--fairway-dark);
  }
  .hud-stats b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:19px;
    color:var(--ink);
    font-weight:600;
    letter-spacing:0;
  }
  .hud-stats div{text-align:right;}
  .hud-stats div:first-child{text-align:left;}

  /* ---------- Canvas ---------- */
  #courseWrap{ position:relative; flex:1 1 auto; min-height:0; background:var(--rough); }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(28,43,31,0.88);
    border:1px solid var(--gold);
    color:var(--paper);
    padding:8px 16px; border-radius:3px; font-size:12px;
    letter-spacing:0.04em; text-transform:uppercase;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

  #hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--paper); opacity:0.75; text-align:center;
    background:rgba(23,58,34,0.55);
    padding:6px 14px; border-radius:20px;
    pointer-events:none;
    transition:opacity .4s ease;
    max-width:88%;
  }

  /* ---------- Swing control (motion mode) ---------- */
  #swingWrap{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #swingReadyBtn{
    background:var(--gold);
    color:var(--ink);
    border:3px solid var(--ink);
    border-radius:40px;
    padding:14px 30px;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  #swingReadyBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }
  #swingReadyBtn.hidden{ display:none; }
  #swingStatus{
    font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    background:rgba(23,58,34,0.7); padding:6px 14px; border-radius:20px;
    opacity:0; transition:opacity .2s ease;
  }
  #swingStatus.show{ opacity:1; }
  #swingStatus.armed{
    color:#fff2c9;
    animation:pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes pulse{ from{opacity:0.6;} to{opacity:1;} }

  /* ---------- Club bar ---------- */
  #clubbar{
    flex-shrink:0; display:flex; gap:8px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:3px dashed var(--sand-dark);
    z-index:5;
  }
  .club-btn{
    flex:1; background:var(--fairway-dark); color:var(--paper);
    border:2px solid transparent; border-radius:8px;
    padding:9px 4px 7px; text-align:center; cursor:pointer; user-select:none;
  }
  .club-btn .name{ font-family:'Fraunces', serif; font-weight:600; font-size:14px; display:block; }
  .club-btn .dist{ font-size:10px; opacity:0.75; letter-spacing:0.04em; }
  .club-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--ink); }

  /* ---------- Overlay ---------- */
  #overlay{
    position:absolute; inset:0; background:rgba(16,26,18,0.86);
    display:flex; align-items:center; justify-content:center;
    z-index:20; opacity:0; pointer-events:none; transition:opacity .3s ease; padding:20px;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }
  .card{
    background:var(--paper); color:var(--ink); border-radius:10px;
    padding:26px 24px 22px; max-width:340px; width:100%; text-align:center;
    border:3px dashed var(--sand-dark);
  }
  .card h2{ font-family:'Fraunces', serif; font-size:26px; margin:0 0 4px; }
  .card .subline{
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--fairway-dark); margin-bottom:16px;
  }
  .score-big{ font-family:'Fraunces', serif; font-size:52px; font-weight:700; line-height:1; margin:6px 0; }
  .score-tag{
    display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    background:var(--fairway-dark); color:var(--paper); padding:4px 10px; border-radius:20px; margin-bottom:18px;
  }
  table.scorecard{ width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:13px; }
  table.scorecard th, table.scorecard td{ padding:6px 4px; border-bottom:1px solid var(--sand-dark); }
  table.scorecard th{ text-transform:uppercase; font-size:10px; letter-spacing:0.06em; color:var(--fairway-dark); }
  table.scorecard tr:last-child td{ border-bottom:none; font-weight:700; font-family:'Fraunces', serif; font-size:15px; }
  .btn{
    display:inline-block; background:var(--fairway-dark); color:var(--paper); border:none;
    padding:12px 26px; border-radius:24px; font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
  }
  .btn:active{ transform:scale(0.97); }
  .btn.secondary{ background:transparent; color:var(--fairway-dark); border:2px solid var(--fairway-dark); margin-top:8px; }

  /* ---------- Permission modal ---------- */
  #permCard p{ font-size:13px; line-height:1.5; margin:0 0 18px; color:var(--ink); }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hud-top">
      <div class="hole-label">Hole <span id="holeNum">1</span><small id="holePar">Par 3</small></div>
      <button id="modeToggle">📱 Motion</button>
    </div>
    <div class="hud-stats">
      <div>To Pin<b id="statYardage">150y</b></div>
      <div>Strokes<b id="statStrokes">0</b></div>
      <div>Lie<b id="statLie">Tee</b></div>
    </div>
  </div>

  <div id="courseWrap">
    <canvas id="course"></canvas>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="swingWrap">
      <div id="swingStatus"></div>
      <button id="swingReadyBtn">⛳ Swing Ready</button>
    </div>
  </div>

  <div id="clubbar">
    <div class="club-btn" data-club="driver"><span class="name">Driver</span><span class="dist">~230y</span></div>
    <div class="club-btn" data-club="iron"><span class="name">Iron</span><span class="dist">~150y</span></div>
    <div class="club-btn active" data-club="wedge"><span class="name">Wedge</span><span class="dist">~80y</span></div>
    <div class="club-btn" data-club="putter"><span class="name">Putter</span><span class="dist">~15y</span></div>
  </div>

  <div id="overlay">
    <div class="card" id="cardContent"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     COURSE DATA  (units: yards)
  ========================================================= */
  const HOLES = [
    {
      par: 3,
      length: 150,
      courseHalfWidth: 26,
      fairway: ()=>({ cx: 0, hw: 17 }),
      green: { cx: 0, y: 150, r: 12 },
      bunkers: [ { cx: 9, y: 143, rx: 6, ry: 5 } ],
      water:   [ { cx: -12, y: 133, rx: 6.5, ry: 5.5 } ]
    },
    {
      par: 4,
      length: 380,
      courseHalfWidth: 32,
      fairway: (y)=>{
        const t = Math.min(1, y/300);
        return { cx: 10*Math.sin(t*Math.PI/2), hw: 15 - 3*t };
      },
      green: { cx: 12, y: 380, r: 11 },
      bunkers: [ { cx: 3, y: 372, rx: 5, ry: 4 }, { cx: 20, y: 376, rx: 5, ry: 4 } ],
      water:   [ { cx: 22, y: 210, rx: 11, ry: 22 } ]
    }
  ];

  const CLUBS = {
    driver: { label:"Driver", v0:2.75, spreadDeg:8,   maxYards:230, swing:{min:6,  max:26} },
    iron:   { label:"Iron",   v0:1.80, spreadDeg:4.5, maxYards:150, swing:{min:5,  max:20} },
    wedge:  { label:"Wedge",  v0:0.97, spreadDeg:3,   maxYards:80,  swing:{min:3,  max:13} },
    putter: { label:"Putter", v0:0.23, spreadDeg:1,   maxYards:15,  swing:{min:0.8,max:5}  }
  };

  const FRICTION = { fairway:0.988, green:0.984, rough:0.950, bunker:0.840 };

  const HOLE_RADIUS = 0.6;
  const STOP_SPEED = 0.015;
  const CAPTURE_SPEED = 0.28;

  const MAX_AIM_RAD = 40 * Math.PI/180;
  const AIM_DRAG_PX_FOR_MAX = 140;

  /* =========================================================
     STATE
  ========================================================= */
  let holeIdx = 0;
  let hole = HOLES[0];
  let ball = { x:0, y:0, vx:0, vy:0, moving:false };
  let shotStartPos = { x:0, y:0 };
  let strokes = 0;
  let scores = [];
  let currentClub = "wedge";

  // touch-mode (slingshot) aim state
  let aiming = false;
  let aimStart = null, aimCurrent = null;
  const MAX_DRAG_PX = 130;
  const MIN_POWER = 0.06;

  // motion-mode aim state
  let baseAngleToPin = 0;
  let aimOffset = 0;
  let aimDragging = false;
  let aimDragStartX = 0, aimBaseOffsetAtDragStart = 0;

  // input mode
  const motionSupported = (typeof window.DeviceMotionEvent !== 'undefined');
  let mode = motionSupported ? 'motion' : 'touch';
  let motionPermissionGranted = false;
  let motionListenerAttached = false;

  // swing detection
  let swingArmed=false, swingHasStarted=false, swingPeak=0, swingDecayCount=0, swingTimeoutHandle=null;
  let gravityBaseline = 9.81;

  const canvas = document.getElementById('course');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let cssW = 0, cssH = 0;
  let pxPerYard = 10;
  let cameraY = 0;

  function resetBallToTee(){
    ball.x = 0; ball.y = 0; ball.vx = 0; ball.vy = 0; ball.moving = false;
  }

  function recomputeAim(){
    baseAngleToPin = Math.atan2(hole.green.cx-ball.x, hole.green.y-ball.y);
    aimOffset = 0;
  }
  function currentAimAngle(){ return baseAngleToPin + aimOffset; }

  function loadHole(idx){
    holeIdx = idx;
    hole = HOLES[idx];
    strokes = 0;
    resetBallToTee();
    recomputeAim();
    document.getElementById('holeNum').textContent = idx+1;
    document.getElementById('holePar').textContent = "Par " + hole.par;
    fitCanvas();
    updateHUD();
    applyModeUI();
  }

  /* =========================================================
     CANVAS SIZING
  ========================================================= */
  function fitCanvas(){
    const wrap = document.getElementById('courseWrap');
    cssW = wrap.clientWidth;
    cssH = wrap.clientHeight;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    pxPerYard = cssW / (hole.courseHalfWidth * 2);
  }
  window.addEventListener('resize', fitCanvas);

  /* =========================================================
     TERRAIN
  ========================================================= */
  function inEllipse(x,y,e){
    const dx = (x-e.cx)/e.rx, dy=(y-e.y)/e.ry;
    return dx*dx+dy*dy <= 1;
  }
  function terrainAt(x,y){
    if (Math.abs(x) > hole.courseHalfWidth + 2 || y < -3 || y > hole.length + 25) return 'ob';
    const g = hole.green;
    const dgx = x-g.cx, dgy = y-g.y;
    if (dgx*dgx+dgy*dgy <= g.r*g.r) return 'green';
    for (const b of hole.bunkers){ if (inEllipse(x,y,b)) return 'bunker'; }
    for (const w of hole.water){ if (inEllipse(x,y,w)) return 'water'; }
    const fw = hole.fairway(y);
    if (Math.abs(x-fw.cx) <= fw.hw && y >= -2 && y <= hole.length+2) return 'fairway';
    return 'rough';
  }
  function lieName(t){
    switch(t){
      case 'fairway': return 'Fairway';
      case 'green': return 'Green';
      case 'bunker': return 'Bunker';
      case 'rough': return 'Rough';
      case 'water': return 'Water';
      case 'ob': return 'O.B.';
      default: return '—';
    }
  }

  /* =========================================================
     WORLD <-> SCREEN
  ========================================================= */
  function worldToScreen(x,y){
    return { sx: cssW/2 + x*pxPerYard, sy: cssH - (y - cameraY)*pxPerYard };
  }
  function updateCamera(){
    const viewYards = cssH / pxPerYard;
    let target = ball.y - viewYards*0.32;
    target = Math.max(-3, target);
    target = Math.min(target, hole.length + 12 - viewYards);
    cameraY += (target - cameraY) * 0.12;
  }

  /* =========================================================
     DRAWING
  ========================================================= */
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.fillStyle = '#173a22';
    ctx.fillRect(0,0,cssW,cssH);

    drawFairway();
    drawYardageMarkers();
    drawHazards();
    drawGreen();
    drawFlag();
    drawBall();

    if (mode === 'touch' && aiming) drawTouchAim();
    if (mode === 'motion' && !ball.moving) drawMotionAim();
  }

  function drawFairway(){
    ctx.beginPath();
    const step = 4;
    let first = true;
    for (let y = Math.max(-2, cameraY-5); y <= hole.length+2; y += step){
      const fw = hole.fairway(y);
      const p = worldToScreen(fw.cx - fw.hw, y);
      if (first){ ctx.moveTo(p.sx,p.sy); first=false; } else ctx.lineTo(p.sx,p.sy);
    }
    for (let y = hole.length+2; y >= Math.max(-2, cameraY-5); y -= step){
      const fw = hole.fairway(y);
      const p = worldToScreen(fw.cx + fw.hw, y);
      ctx.lineTo(p.sx,p.sy);
    }
    ctx.closePath();
    ctx.fillStyle = '#2f6b45';
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = pxPerYard*3.4;
    for (let y=-10;y<hole.length+20;y+=14){
      const p1 = worldToScreen(-60,y);
      const p2 = worldToScreen(60,y);
      ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.stroke();
    }
    ctx.restore();

    const teeMarkL = worldToScreen(-3,0), teeMarkR = worldToScreen(3,0.6);
    ctx.fillStyle = 'rgba(242,236,216,0.5)';
    ctx.fillRect(teeMarkL.sx, teeMarkR.sy, teeMarkR.sx-teeMarkL.sx, (worldToScreen(0,0).sy - teeMarkR.sy));
  }

  function drawYardageMarkers(){
    ctx.strokeStyle = 'rgba(242,236,216,0.18)';
    ctx.fillStyle = 'rgba(242,236,216,0.55)';
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.textBaseline = 'middle';
    const startY = Math.floor(Math.max(0,cameraY)/50)*50;
    for (let y=startY; y<=hole.length; y+=50){
      if (y===0) continue;
      const remaining = hole.length - y;
      const p1 = worldToScreen(-hole.courseHalfWidth-1, y);
      const p2 = worldToScreen(-hole.courseHalfWidth-1+1.6, y);
      ctx.beginPath(); ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.stroke();
      ctx.fillText(remaining+'y', p2.sx+4, p2.sy);
    }
  }

  function drawHazards(){
    ctx.fillStyle = '#e3c98a';
    for (const b of hole.bunkers){
      const p = worldToScreen(b.cx,b.y);
      ctx.beginPath();
      ctx.ellipse(p.sx,p.sy, b.rx*pxPerYard, b.ry*pxPerYard, 0,0,Math.PI*2);
      ctx.fill();
    }
    for (const w of hole.water){
      const p = worldToScreen(w.cx,w.y);
      const grad = ctx.createRadialGradient(p.sx,p.sy,2,p.sx,p.sy,Math.max(w.rx,w.ry)*pxPerYard);
      grad.addColorStop(0,'#4b8bb0');
      grad.addColorStop(1,'#2f6f96');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(p.sx,p.sy, w.rx*pxPerYard, w.ry*pxPerYard, 0,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawGreen(){
    const g = hole.green;
    const p = worldToScreen(g.cx,g.y);
    ctx.fillStyle = '#3f8156';
    ctx.beginPath();
    ctx.arc(p.sx,p.sy, g.r*pxPerYard, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0c1610';
    ctx.beginPath();
    ctx.arc(p.sx,p.sy, Math.max(2.5,HOLE_RADIUS*pxPerYard), 0, Math.PI*2);
    ctx.fill();
  }

  function drawFlag(){
    const g = hole.green;
    const p = worldToScreen(g.cx,g.y);
    ctx.strokeStyle = '#f2ecd8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.sx,p.sy);
    ctx.lineTo(p.sx, p.sy - 26);
    ctx.stroke();
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy-26);
    ctx.lineTo(p.sx+14, p.sy-21);
    ctx.lineTo(p.sx, p.sy-16);
    ctx.closePath();
    ctx.fill();
  }

  function drawBall(){
    const p = worldToScreen(ball.x,ball.y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(p.sx,p.sy+2, 5,2.4, 0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f8f6ee';
    ctx.beginPath();
    ctx.arc(p.sx,p.sy, 4.5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(28,43,31,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // touch-mode: full slingshot aim + power line
  function drawTouchAim(){
    const ballP = worldToScreen(ball.x,ball.y);
    const dx = aimCurrent.x - aimStart.x;
    const dy = aimCurrent.y - aimStart.y;
    const dragLen = Math.min(Math.hypot(dx,dy), MAX_DRAG_PX);
    const ang = Math.atan2(dy,dx);
    const shotAng = ang + Math.PI;
    const power = dragLen / MAX_DRAG_PX;

    const lineLen = 40 + power*90;
    const ex = ballP.sx + Math.cos(shotAng)*lineLen;
    const ey = ballP.sy + Math.sin(shotAng)*lineLen;

    ctx.strokeStyle = '#c9a24b';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6,5]);
    ctx.beginPath();
    ctx.moveTo(ballP.sx,ballP.sy);
    ctx.lineTo(ex,ey);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#c9a24b';
    ctx.beginPath();
    ctx.arc(ex,ey,4,0,Math.PI*2);
    ctx.fill();

    const barW = 100, barH = 8;
    const bx = cssW/2 - barW/2, by = 16;
    ctx.fillStyle = 'rgba(23,58,34,0.7)';
    ctx.fillRect(bx,by,barW,barH);
    ctx.fillStyle = power>0.9 ? '#c0392b' : '#c9a24b';
    ctx.fillRect(bx,by,barW*power,barH);
    ctx.strokeStyle = 'rgba(242,236,216,0.6)';
    ctx.strokeRect(bx,by,barW,barH);
  }

  // motion-mode: direction-only aim line, power comes from the physical swing
  function drawMotionAim(){
    const angle = currentAimAngle();
    const dirX = Math.sin(angle), dirY = Math.cos(angle);
    const lenYards = Math.min(70, Math.hypot(hole.green.cx-ball.x, hole.green.y-ball.y)+8);
    const p0 = worldToScreen(ball.x,ball.y);
    const p1 = worldToScreen(ball.x+dirX*lenYards, ball.y+dirY*lenYards);

    ctx.strokeStyle = '#c9a24b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,5]);
    ctx.beginPath();
    ctx.moveTo(p0.sx,p0.sy);
    ctx.lineTo(p1.sx,p1.sy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#c9a24b';
    ctx.beginPath();
    ctx.arc(p1.sx,p1.sy,4,0,Math.PI*2);
    ctx.fill();

    const deg = Math.round(aimOffset*180/Math.PI);
    const label = deg===0 ? 'Straight at pin' : (deg>0 ? deg+'° right' : (-deg)+'° left');
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(242,236,216,0.85)';
    ctx.textAlign = 'center';
    ctx.fillText(label, cssW/2, 30);
    ctx.textAlign = 'left';
  }

  /* =========================================================
     POINTER INPUT (aiming — behavior depends on mode)
  ========================================================= */
  canvas.addEventListener('pointerdown', (e)=>{
    if (ball.moving) return;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX-rect.left, py = e.clientY-rect.top;
    hideHint();
    if (mode === 'touch'){
      aiming = true;
      aimStart = {x:px,y:py};
      aimCurrent = {x:px,y:py};
    } else {
      aimDragging = true;
      aimDragStartX = e.clientX;
      aimBaseOffsetAtDragStart = aimOffset;
    }
  });
  canvas.addEventListener('pointermove', (e)=>{
    if (mode === 'touch'){
      if (!aiming) return;
      const rect = canvas.getBoundingClientRect();
      aimCurrent = {x:e.clientX-rect.left, y:e.clientY-rect.top};
    } else {
      if (!aimDragging) return;
      const dx = e.clientX - aimDragStartX;
      let off = aimBaseOffsetAtDragStart + (dx/AIM_DRAG_PX_FOR_MAX)*MAX_AIM_RAD;
      off = Math.max(-MAX_AIM_RAD, Math.min(MAX_AIM_RAD, off));
      aimOffset = off;
    }
  });
  function endTouchAim(){
    if (!aiming) return;
    aiming = false;
    const dx = aimCurrent.x - aimStart.x;
    const dy = aimCurrent.y - aimStart.y;
    const dragLen = Math.hypot(dx,dy);
    const power = Math.min(dragLen,MAX_DRAG_PX)/MAX_DRAG_PX;
    if (power < MIN_POWER) return;
    const ang = Math.atan2(dy,dx) + Math.PI;
    touchFireShot(ang, power);
  }
  canvas.addEventListener('pointerup', ()=>{
    if (mode === 'touch') endTouchAim();
    else aimDragging = false;
  });
  canvas.addEventListener('pointercancel', ()=>{ aiming=false; aimDragging=false; });

  function hideHint(){ document.getElementById('hint').style.opacity = 0; }

  /* =========================================================
     CLUB SELECT
  ========================================================= */
  document.querySelectorAll('.club-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (ball.moving || swingArmed) return;
      document.querySelectorAll('.club-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentClub = btn.dataset.club;
    });
  });

  /* =========================================================
     MODE TOGGLE
  ========================================================= */
  const modeBtn = document.getElementById('modeToggle');
  modeBtn.addEventListener('click', ()=>{
    if (!motionSupported) return;
    if (ball.moving || swingArmed) return;
    mode = (mode === 'motion') ? 'touch' : 'motion';
    applyModeUI();
  });

  function applyModeUI(){
    const hint = document.getElementById('hint');
    const swingWrap = document.getElementById('swingWrap');
    if (!motionSupported){
      modeBtn.disabled = true;
      modeBtn.textContent = '👆 Touch only';
      swingWrap.style.display = 'none';
      hint.textContent = 'Drag back from the ball to aim · release to swing';
    } else if (mode === 'motion'){
      modeBtn.textContent = '📱 Motion';
      swingWrap.style.display = 'flex';
      showSwingButton();
      hint.textContent = 'Drag left/right to aim, then swing your phone like a club';
    } else {
      modeBtn.textContent = '👆 Touch';
      swingWrap.style.display = 'none';
      hint.textContent = 'Drag back from the ball to aim · release to swing';
    }
    hint.style.opacity = 0.75;
  }

  /* =========================================================
     MOTION SWING DETECTION
  ========================================================= */
  const swingBtn = document.getElementById('swingReadyBtn');
  const swingStatusEl = document.getElementById('swingStatus');

  function setSwingStatus(text, armed){
    swingStatusEl.textContent = text;
    swingStatusEl.classList.toggle('show', !!text);
    swingStatusEl.classList.toggle('armed', !!armed);
  }
  function showSwingButton(text){
    swingBtn.textContent = text || '⛳ Swing Ready';
    swingBtn.classList.remove('hidden');
  }
  function hideSwingButton(){ swingBtn.classList.add('hidden'); }

  function ensureMotionPermission(){
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      return DeviceMotionEvent.requestPermission().then(state => state === 'granted');
    }
    return Promise.resolve(true);
  }

  swingBtn.addEventListener('click', async ()=>{
    if (ball.moving || swingArmed) return;
    if (!motionPermissionGranted){
      let granted = true;
      try { granted = await ensureMotionPermission(); }
      catch(err){ granted = false; }
      motionPermissionGranted = granted;
      if (!granted){
        setSwingStatus('Motion access denied — switch to Touch mode above', false);
        return;
      }
      if (!motionListenerAttached){
        window.addEventListener('devicemotion', handleMotion);
        motionListenerAttached = true;
      }
    }
    armSwing();
  });

  function currentSwingThresholds(){ return CLUBS[currentClub].swing; }

  function armSwing(){
    swingArmed = true;
    swingHasStarted = false;
    swingPeak = 0;
    swingDecayCount = 0;
    hideSwingButton();
    setSwingStatus('Swing now!', true);
    clearTimeout(swingTimeoutHandle);
    swingTimeoutHandle = setTimeout(()=>{
      if (!swingArmed) return;
      swingArmed = false;
      const th = currentSwingThresholds();
      if (swingHasStarted && swingPeak > th.min*0.5){
        completeSwing();
      } else {
        setSwingStatus('No swing detected — tap to try again', false);
        showSwingButton('⛳ Try Again');
      }
    }, 2500);
  }

  function handleMotion(e){
    if (!swingArmed) return;
    let ax, ay, az, usingGravityIncl = false;
    if (e.acceleration && e.acceleration.x != null){
      ax = e.acceleration.x; ay = e.acceleration.y; az = e.acceleration.z;
    } else if (e.accelerationIncludingGravity){
      ax = e.accelerationIncludingGravity.x; ay = e.accelerationIncludingGravity.y; az = e.accelerationIncludingGravity.z;
      usingGravityIncl = true;
    } else return;

    let mag = Math.sqrt(ax*ax + ay*ay + az*az);
    if (usingGravityIncl){
      gravityBaseline += (mag - gravityBaseline) * 0.02;
      mag = Math.abs(mag - gravityBaseline);
    }

    const th = currentSwingThresholds();
    const startThresh = th.min * 0.5;

    if (!swingHasStarted){
      if (mag > startThresh){ swingHasStarted = true; swingPeak = mag; swingDecayCount = 0; }
    } else {
      if (mag > swingPeak){ swingPeak = mag; swingDecayCount = 0; }
      else {
        swingDecayCount++;
        if (swingDecayCount > 4 && swingPeak > startThresh*1.3){
          swingArmed = false;
          clearTimeout(swingTimeoutHandle);
          completeSwing();
        }
      }
    }
  }

  function completeSwing(){
    const th = currentSwingThresholds();
    let power = (swingPeak - th.min) / (th.max - th.min);
    power = Math.max(0.12, Math.min(1, power));
    setSwingStatus('Swing power ' + Math.round(power*100) + '%', false);
    motionFireShot(currentAimAngle(), power);
    setTimeout(()=>{ if (!ball.moving) showSwingButton(); }, 1400);
  }

  /* =========================================================
     SHOOTING / PHYSICS
  ========================================================= */
  function launchBall(vx, vy){
    shotStartPos = { x: ball.x, y: ball.y };
    ball.vx = vx; ball.vy = vy; ball.moving = true;
    strokes++;
    updateHUD();
  }

  function touchFireShot(finalAngleScreen, power){
    if (ball.moving) return;
    const club = CLUBS[currentClub];
    const spreadRad = club.spreadDeg * Math.PI/180;
    const missAngle = (Math.random()-0.5)*2*spreadRad;
    const finalAngle = finalAngleScreen + missAngle;
    const speed = club.v0 * power;
    // finalAngle is a screen-space angle (y-down); world space is y-up, so vy flips.
    launchBall(Math.cos(finalAngle)*speed, -Math.sin(finalAngle)*speed);
  }

  function motionFireShot(aimAngle, power){
    if (ball.moving) return;
    const club = CLUBS[currentClub];
    const spreadRad = club.spreadDeg * Math.PI/180;
    const missAngle = (Math.random()-0.5)*2*spreadRad;
    const finalAim = aimAngle + missAngle;
    const speed = club.v0 * power;
    // compass-style convention: 0 = straight up the fairway, positive = rightward.
    launchBall(Math.sin(finalAim)*speed, Math.cos(finalAim)*speed);
  }

  let lastT = null;
  function physicsStep(dt){
    if (!ball.moving) return;
    const steps = Math.max(1, Math.round(dt/16.67));
    const subDt = dt/steps;
    for (let i=0;i<steps;i++){
      ball.x += ball.vx * (subDt/16.67);
      ball.y += ball.vy * (subDt/16.67);

      const t = terrainAt(ball.x, ball.y);
      if (t === 'water' || t === 'ob'){ penalizeAndReset(t); return; }

      const g = hole.green;
      const dgx = ball.x-g.cx, dgy = ball.y-g.y;
      const distToHole = Math.hypot(dgx,dgy);
      const speed = Math.hypot(ball.vx,ball.vy);
      if (distToHole < HOLE_RADIUS && speed < CAPTURE_SPEED){ holeComplete(); return; }

      const decayBase = FRICTION[t] || FRICTION.rough;
      const decay = Math.pow(decayBase, subDt/16.67);
      ball.vx *= decay;
      ball.vy *= decay;

      const sp = Math.hypot(ball.vx,ball.vy);
      if (sp < STOP_SPEED){
        ball.vx = 0; ball.vy = 0; ball.moving = false;
        onBallStopped();
        break;
      }
    }
    updateHUD();
  }

  function onBallStopped(){
    recomputeAim();
    updateHUD();
    if (mode === 'motion') showSwingButton();
  }

  function penalizeAndReset(kind){
    strokes++;
    showToast(kind==='water' ? 'Splash! +1 penalty' : 'Out of bounds — +1 penalty');
    ball.x = shotStartPos.x; ball.y = shotStartPos.y;
    ball.vx = 0; ball.vy = 0; ball.moving = false;
    recomputeAim();
    updateHUD();
    if (mode === 'motion') showSwingButton();
  }

  function holeComplete(){
    ball.vx=0; ball.vy=0; ball.moving=false;
    scores[holeIdx] = strokes;
    showHoleCompleteCard();
  }

  /* =========================================================
     HUD / TOAST / OVERLAY
  ========================================================= */
  function updateHUD(){
    document.getElementById('statStrokes').textContent = strokes;
    const dist = Math.max(0, Math.hypot(ball.x-hole.green.cx, ball.y-hole.green.y));
    document.getElementById('statYardage').textContent = Math.round(dist) + 'y';
    document.getElementById('statLie').textContent = lieName(terrainAt(ball.x,ball.y));
  }

  let toastTimer=null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function scoreTag(strokesTaken, par){
    const diff = strokesTaken-par;
    if (strokesTaken===1) return "Hole in One!";
    if (diff<=-2) return "Eagle";
    if (diff===-1) return "Birdie";
    if (diff===0) return "Par";
    if (diff===1) return "Bogey";
    if (diff===2) return "Double Bogey";
    return diff+" over";
  }

  function showHoleCompleteCard(){
    const card = document.getElementById('cardContent');
    const isLast = holeIdx === HOLES.length-1;
    card.innerHTML = `
      <div class="subline">Hole ${holeIdx+1} · Par ${hole.par}</div>
      <div class="score-big">${strokes}</div>
      <div class="score-tag">${scoreTag(strokes,hole.par)}</div>
      <div><button class="btn" id="nextBtn">${isLast ? 'See Scorecard' : 'Next Hole'}</button></div>
    `;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      document.getElementById('overlay').classList.remove('show');
      if (isLast){ showFinalScorecard(); }
      else { loadHole(holeIdx+1); }
    }, {once:true});
  }

  function showFinalScorecard(){
    const card = document.getElementById('cardContent');
    let totalStrokes=0, totalPar=0, rows='';
    HOLES.forEach((h,i)=>{
      totalStrokes += scores[i]||0;
      totalPar += h.par;
      rows += `<tr><td>${i+1}</td><td>${h.par}</td><td>${scores[i]||0}</td></tr>`;
    });
    const diff = totalStrokes-totalPar;
    const diffLabel = diff===0 ? 'Even par' : (diff>0? '+'+diff : diff);
    card.innerHTML = `
      <h2>Round Complete</h2>
      <div class="subline">${diffLabel} · ${totalStrokes} strokes</div>
      <table class="scorecard">
        <tr><th>Hole</th><th>Par</th><th>Score</th></tr>
        ${rows}
        <tr><td>Total</td><td>${totalPar}</td><td>${totalStrokes}</td></tr>
      </table>
      <button class="btn" id="againBtn">Play Again</button>
    `;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('againBtn').addEventListener('click', ()=>{
      document.getElementById('overlay').classList.remove('show');
      scores = [];
      loadHole(0);
    }, {once:true});
  }

  /* =========================================================
     MAIN LOOP
  ========================================================= */
  function frame(ts){
    if (lastT===null) lastT = ts;
    const dt = Math.min(48, ts-lastT);
    lastT = ts;
    physicsStep(dt);
    updateCamera();
    draw();
    requestAnimationFrame(frame);
  }

  /* =========================================================
     INIT
  ========================================================= */
  loadHole(0);
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
